version: "3.9"

# ── MotionScope GPU Compose ────────────────────────────────────────────────────
# Prerequisites:
#   - NVIDIA GPU + driver ≥ 525
#   - nvidia-container-toolkit installed
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Usage:
#   docker compose up --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  motionscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: motionscope:gpu
    container_name: motionscope

    # ── GPU access ────────────────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ── Ports ─────────────────────────────────────────────────────────────────
    ports:
      - "7860:7860"

    # ── Volumes (mount local sample folder for easy swap) ─────────────────────
    volumes:
      - ./sample:/app/sample
      - ./outputs:/app/outputs   # output videos land here on the host

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860

    # ── Restart policy ────────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime shm size (prevents shared memory OOM for video frames) ────────
    shm_size: "2gb"
